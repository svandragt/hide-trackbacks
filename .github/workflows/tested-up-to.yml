name: Bump tested WordPress version

# WordPress.org de-emphasises plugins that are not tested against recent major
# releases, so this is the one piece of upkeep that has a visible consequence.
# Fully hands-off: it opens a pull request for the audit trail that merges once
# CI passes; the merge syncs the result to the plugin directory without anyone touching it.
#
# Deliberately dependency-free. The previous attempt at this used an action that
# required npm dependency updates, which this plugin does not have.

on:
  schedule:
    # Weekly, because sites take up the new WordPress version quickly and the
    # readme should not lag behind what people are already running. A run that
    # finds nothing to do is one API call and exits, so the frequency is cheap.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tested-up-to

jobs:
  bump:
    name: Bump readme and open pull request
    runs-on: ubuntu-latest
    steps:
      - name: Check RELEASE_TOKEN is set
        env:
          HAS_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Secret RELEASE_TOKEN is not set. Add a PAT with Contents and Pull requests: read and write."
            exit 1
          fi

      # The branch is pushed with RELEASE_TOKEN because a GITHUB_TOKEN push starts
      # no workflow runs, so ci.yml would never report the required 'test' check.
      - uses: actions/checkout@v7
        with:
          ref: master
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Look up the current WordPress version
        id: wp
        run: |
          set -euo pipefail
          payload="$(curl -fsSL 'https://api.wordpress.org/core/version-check/1.7/')"
          full="$(printf '%s' "$payload" | php -r 'echo json_decode(stream_get_contents(STDIN), true)["offers"][0]["current"] ?? "";')"
          version="$(printf '%s' "$full" | cut -d. -f1,2)"
          # Refuse to write anything that is not a plausible version, so an API
          # change or an empty response fails the run instead of corrupting readme.txt.
          case "$version" in
            [0-9]*.[0-9]*) ;;
            *) echo "Unexpected version in API response: '$full'" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update readme.txt
        id: bump
        env:
          VERSION: ${{ steps.wp.outputs.version }}
        run: |
          set -euo pipefail
          current="$(sed -n 's/^Tested up to: *//p' readme.txt | head -1)"
          if [ "$current" = "$VERSION" ]; then
            echo "Already tested up to $VERSION, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i "s/^Tested up to:.*/Tested up to: $VERSION/" readme.txt
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The pull request records the bump; auto-merge lands it once ci.yml passes,
      # so Plugin Check sees the edited readme. Auto-merge is enabled with
      # RELEASE_TOKEN so the merge starts on-master-asset-update.yml, which syncs
      # the readme to the WordPress.org trunk; a GITHUB_TOKEN merge would start
      # nothing. --merge (not --squash) matches dependabot-auto-merge.yml.
      # The force push and PR reuse let a re-run recover from a failed earlier run,
      # which otherwise leaves the branch behind and rejects every later push.
      - name: Open the bump pull request and enable auto-merge
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.wp.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/tested-up-to-$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git commit -am "chore: tested up to WordPress $VERSION"
          git push --force -u origin "$branch"
          if [ "$(gh pr list --head "$branch" --state open --json number -q length)" = "0" ]; then
            gh pr create \
              --base master \
              --head "$branch" \
              --title "Update tested WordPress version to $VERSION" \
              --body "Automated bump of the 'Tested up to' field in readme.txt to WordPress $VERSION, opened by tested-up-to.yml. It merges once CI passes, and the merge syncs the readme to the WordPress.org trunk. Shipping a new plugin version still requires a git tag."
          fi
          gh pr merge "$branch" --auto --merge
